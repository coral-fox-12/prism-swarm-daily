<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>PRISM SWARM: Daily</title>
<link rel="stylesheet" href="./game.css">
</head>
<body>
<canvas id="game" aria-label="Prism Swarm Daily: fly your ship, match your shot colour to the enemy, survive the swarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div class="overlay" id="mode-buttons">
  <button id="btn-daily" type="button">&#9654; DAILY RUN</button>
  <button id="btn-practice" type="button">PRACTICE &mdash; FREE PLAY</button>
</div>

<div class="overlay" id="board">
  <h2>TODAY&rsquo;S LEADERBOARD</h2>
  <p class="sub" id="board-date"></p>
  <ol id="board-list"></ol>
  <p class="empty" id="board-empty" style="display:none">No scores yet today &mdash; be the first!</p>
  <button id="btn-share" type="button" style="display:none">SHARE MY SCORE ON REDDIT</button>
</div>
<button class="overlay" id="board-toggle" type="button">LEADERBOARD</button>
<div class="overlay" id="toast" role="status"></div>
<div id="joy-base"></div>
<div id="joy-knob"></div>

<script type="module" src="./main.ts"></script>
</body>
</html>
