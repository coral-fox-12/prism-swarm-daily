<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="data:,">
<title>PRISM SWARM: Daily</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070812; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .overlay { position: fixed; z-index: 5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #mode-buttons {
    left: 50%; top: 74%; transform: translateX(-50%);
    display: none; flex-direction: column; gap: 10px; width: min(420px, 86vw);
  }
  #mode-buttons.show { display: flex; }
  #mode-buttons button {
    padding: 13px 16px; font-size: 17px; font-weight: 800; border-radius: 12px;
    border: 1px solid rgba(140, 160, 255, 0.5); cursor: pointer;
  }
  #btn-daily { color: #0a0618; background: linear-gradient(90deg, #ff4d6d, #fbbf24); border: 0; }
  #btn-practice { color: #eef2ff; background: rgba(10, 14, 34, 0.85); }
  #btn-daily:disabled { opacity: 0.45; cursor: default; }
  #board-toggle {
    right: 14px; bottom: 14px; padding: 10px 14px; font-size: 15px; font-weight: 700;
    color: #eef2ff; background: rgba(10, 14, 34, 0.85);
    border: 1px solid rgba(140, 160, 255, 0.5); border-radius: 12px; cursor: pointer;
  }
  #board {
    right: 14px; top: 14px; width: min(300px, 82vw);
    background: rgba(10, 14, 34, 0.92); border: 1px solid rgba(140, 160, 255, 0.35);
    border-radius: 14px; padding: 14px 16px; color: #eef2ff; display: none;
  }
  #board.show { display: block; }
  #board h2 { margin: 0 0 4px; font-size: 15px; letter-spacing: 0.08em; color: #ffd166; }
  #board .sub { margin: 0 0 10px; font-size: 12px; color: #93a0c4; }
  #board ol { margin: 0; padding-left: 22px; font-size: 14px; }
  #board li { padding: 3px 0; display: flex; justify-content: space-between; gap: 8px; }
  #board li.you { color: #ffd166; font-weight: 800; }
  #board .empty { font-size: 13px; color: #93a0c4; }
  #btn-share {
    margin-top: 12px; width: 100%; padding: 10px; font-size: 14px; font-weight: 800;
    color: #0a0618; background: #4ade80; border: 0; border-radius: 10px; cursor: pointer;
  }
  #btn-share:disabled { opacity: 0.5; cursor: default; }
  #toast {
    left: 50%; bottom: 18px; transform: translateX(-50%);
    background: rgba(10, 14, 34, 0.92); border: 1px solid rgba(140, 160, 255, 0.35);
    color: #eef2ff; border-radius: 10px; padding: 9px 16px; font-size: 14px;
    display: none; max-width: 86vw; text-align: center;
  }
  #toast.show { display: block; }
  #joy-base, #joy-knob {
    position: fixed; z-index: 4; border-radius: 50%; display: none; pointer-events: none;
  }
  #joy-base { width: 110px; height: 110px; border: 2px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.06); }
  #joy-knob { width: 48px; height: 48px; background: rgba(255, 255, 255, 0.55); }
</style>
</head>
<body>
<canvas id="game" aria-label="Prism Swarm Daily: fly your ship, match your shot colour to the enemy, survive the swarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>

<div class="overlay" id="mode-buttons">
  <button id="btn-daily" type="button">▶ DAILY RUN</button>
  <button id="btn-practice" type="button">PRACTICE — FREE PLAY</button>
</div>

<div class="overlay" id="board">
  <h2>🏆 TODAY’S LEADERBOARD</h2>
  <p class="sub" id="board-date"></p>
  <ol id="board-list"></ol>
  <p class="empty" id="board-empty" style="display:none">No scores yet today — be the first!</p>
  <button id="btn-share" type="button" style="display:none">💬 SHARE MY SCORE ON REDDIT</button>
</div>
<button class="overlay" id="board-toggle" type="button">🏆 LEADERBOARD</button>
<div class="overlay" id="toast" role="status"></div>
<div id="joy-base"></div>
<div id="joy-knob"></div>

<script type="module" src="./main.ts"></script>
</body>
</html>
