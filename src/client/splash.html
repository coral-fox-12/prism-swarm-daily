<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>PRISM SWARM: Daily</title>
<link rel="stylesheet" href="./splash.css">
</head>
<body>
<main class="card" id="card">
  <div class="eyebrow">🔴 r/PrismSwarmDaily · DAILY GAME</div>
  <h1><span class="c1">P</span><span class="c2">R</span><span class="c3">I</span><span class="c4">S</span><span class="c5">M</span> SWARM</h1>
  <p class="tag">Match the colour. Break the swarm. One seed, one day, three tries.</p>
  <div class="stats">
    <div class="stat"><span class="label">TODAY</span><span class="value" id="today">—</span></div>
    <div class="stat"><span class="label">BEST TODAY</span><span class="value" id="best">—</span></div>
    <div class="stat"><span class="label">STREAK</span><span class="value" id="streak">—</span></div>
  </div>
  <button class="play" id="play" type="button">▶ PLAY TODAY’S SWARM</button>
  <p class="hint">2-minute run · 3 attempts a day · same swarm for everyone today</p>
</main>
<script type="module" src="./splash.ts"></script>
</body>
</html>
